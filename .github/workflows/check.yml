name: Rebuild ACS rent burden
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rebuild:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s . -p "test*.py"
      - run: python build.py --year 2024
      - run: git diff --exit-code -- metro-rent-burden-2024.csv summary-2024.json excluded-cbsa-2024.json
      - run: python verify_workbook.py
