name: Rebuild ACS rent burden
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rebuild:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s . -p "test*.py"
      - run: python build.py --year 2024
      - run: git diff --exit-code -- metro-rent-burden-2024.csv summary-2024.json excluded-cbsa-2024.json
      - run: python verify_workbook.py
